name: AOS6 Hosted Disposable Rehearsal

on:
  push:
    branches:
      - 'feature/aos-6-lari-controlled-pilot'
    paths:
      - 'src/aos/**'
      - 'schemas/v0.1/**'
      - 'tests/**'
      - '.github/workflows/aos6-hosted-disposable-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-disposable-rehearsal:
    name: Hosted Disposable Rehearsal Proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AOS Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Exact AOS SHA Binding
        run: |
          echo "Expected HEAD: ${{ github.sha }}"
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Actual HEAD: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "${{ github.sha }}" ]; then
            echo "SHA mismatch failure!"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AOS Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest jsonschema

      - name: Pre-Seal Docker Image Acquisition
        run: |
          docker pull postgres:16
          IMG_ID=$(docker inspect --format='{{.Id}}' postgres:16)
          REPO_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' postgres:16 || echo "postgres@sha256:unknown")
          echo "POSTGRES_IMAGE_ID=$IMG_ID" >> $GITHUB_ENV
          echo "POSTGRES_REPO_DIGEST=$REPO_DIGEST" >> $GITHUB_ENV
          echo "Docker image postgres:16 acquired successfully with ID $IMG_ID."

      - name: Mark Disposable Execution Boundary Sealed
        run: |
          echo "DISPOSABLE_EXECUTION_BOUNDARY=SEALED"
          echo "All downstream target container executions will use --network none."

      - name: Run Hosted Disposable Rehearsal
        run: |
          python -m aos.hosted_disposable_rehearsal \
            tests/fixtures/hosted_disposable_rehearsal/request.valid.json \
            --fixture-root tests/fixtures/hosted_disposable_rehearsal \
            --output-dir ${{ runner.temp }}/aos-hosted-disposable-rehearsal \
            --postgres-image-id "$POSTGRES_IMAGE_ID" \
            --postgres-repo-digest "$POSTGRES_REPO_DIGEST"

      - name: Validate Generated R3 Rehearsal Report
        run: |
          python -m aos.rehearsal_evidence \
            ${{ runner.temp }}/aos-hosted-disposable-rehearsal/report.json \
            --repo-root .

      - name: Verify Report ↔ Runtime Manifest Cryptographic Binding
        run: |
          python -c "
          import json, hashlib, sys
          from pathlib import Path
          report_p = Path('${{ runner.temp }}/aos-hosted-disposable-rehearsal/report.json')
          manifest_p = Path('${{ runner.temp }}/aos-hosted-disposable-rehearsal/runtime_manifest.json')
          report = json.loads(report_p.read_text('utf-8'))
          manifest_bytes = manifest_p.read_bytes()
          actual_sha = hashlib.sha256(manifest_bytes).hexdigest()
          claimed_sha = report.get('runtime_evidence_binding', {}).get('manifest_sha256', '')
          if claimed_sha.lower() != actual_sha.lower():
              print(f'Binding failed: claimed={claimed_sha} != actual={actual_sha}', file=sys.stderr)
              sys.exit(1)
          print('Report ↔ Manifest binding verified successfully.')
          "

      - name: Verify AOS Source Immutability & Generate Hosted Attestation
        run: |
          git status --porcelain=v1 --untracked-files=all
          git diff --exit-code
          IMMUTABLE_RES="PASS"

          python -c "
          import json, hashlib, os
          from pathlib import Path

          report_bytes = Path('${{ runner.temp }}/aos-hosted-disposable-rehearsal/report.json').read_bytes()
          manifest_bytes = Path('${{ runner.temp }}/aos-hosted-disposable-rehearsal/runtime_manifest.json').read_bytes()

          attestation = {
              'schema_version': '0.1',
              'aos_source_sha': '${{ github.sha }}',
              'report_sha256': hashlib.sha256(report_bytes).hexdigest(),
              'runtime_manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(),
              'worktree_immutable_result': 'PASS'
          }

          Path('${{ runner.temp }}/aos-hosted-disposable-rehearsal/hosted_attestation.json').write_text(json.dumps(attestation, indent=2), encoding='utf-8')
          "

      - name: Validate Hosted Attestation Schema
        run: |
          python -m aos.validate hosted_attestation ${{ runner.temp }}/aos-hosted-disposable-rehearsal/hosted_attestation.json

      - name: Upload Noncanonical Rehearsal Artifact Directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos6-hosted-disposable-rehearsal-report
          path: ${{ runner.temp }}/aos-hosted-disposable-rehearsal/
          retention-days: 7
