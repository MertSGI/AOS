name: AOS CI

on:
  push:
    branches: [ main, 'feature/**', 'aos/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aos
          POSTGRES_PASSWORD: aos_ci_test
          POSTGRES_DB: aos_coordination_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aos -d aos_coordination_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AOS_POSTGRES_TEST_DSN: postgresql://aos:aos_ci_test@127.0.0.1:5432/aos_coordination_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Verify PostgreSQL connectivity
        run: |
          python -c "
          import os, psycopg
          dsn = os.environ.get('AOS_POSTGRES_TEST_DSN')
          if not dsn:
              raise RuntimeError('AOS_POSTGRES_TEST_DSN environment variable not set')
          try:
              conn = psycopg.connect(dsn)
              print('PostgreSQL connectivity: PASS')
              conn.close()
          except Exception:
              raise RuntimeError('PostgreSQL connectivity check failed')
          "

      - name: Run offline/non-Postgres pytest suite
        run: |
          python -m pytest -v --tb=short \
            -m "not postgres_integration and not live_read_only"

      - name: Run Postgres integration tests
        run: |
          python -m pytest -v --tb=short \
            tests/test_coordination_postgres.py \
            -m "postgres_integration"

      - name: Run full canonical pytest suite
        run: |
          python -m pytest -v --tb=short

      - name: Validate canonical state and evidence files
        run: |
          python -m aos.validate state docs/project-control/STATE.json
          python -m aos.validate evidence docs/project-control/EVIDENCE.jsonl
