name: AOS-2 Remote Live Proof Gate

on:
  push:
    branches:
      - feature/aos-2-shadow-orchestrator
    paths:
      - .aos-control/live-proof-request.json

permissions:
  contents: read

jobs:
  remote-live-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Remote Live Proof
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m aos.live_proof --ci

      - name: Upload Proof Evidence Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aos2-live-proof-evidence
          path: |
            .aos-runtime/shadow/*.json
            .aos-runtime/live-proof/*.json
          retention-days: 7
