name: AOS6 Isolated Controlled Pilot

on:
  workflow_dispatch:
    inputs:
      authorized_execution_aos_sha:
        description: Explicit Controller-authorized exact executable AOS SHA
        required: true
        type: string
      authority_evidence_sha:
        description: Explicit Controller-authorized authority evidence SHA
        required: true
        type: string
      authority_id:
        description: Explicit Controller authority event ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolated-controlled-pilot:
    name: Isolated Controlled Pilot Execution
    runs-on: ubuntu-latest

    steps:
      - name: Validate Input Formats
        env:
          AUTHORIZED_EXECUTION_AOS_SHA: ${{ inputs.authorized_execution_aos_sha }}
          AUTHORITY_EVIDENCE_SHA: ${{ inputs.authority_evidence_sha }}
          AUTHORITY_ID: ${{ inputs.authority_id }}
        run: |
          python -c "
          import os, re, sys
          exec_sha = os.environ.get('AUTHORIZED_EXECUTION_AOS_SHA', '')
          auth_sha = os.environ.get('AUTHORITY_EVIDENCE_SHA', '')
          auth_id = os.environ.get('AUTHORITY_ID', '')

          if not re.match(r'^[0-9a-f]{40}$', exec_sha):
              print(f'Invalid authorized_execution_aos_sha format: \"{exec_sha}\"', file=sys.stderr)
              sys.exit(1)

          if not re.match(r'^[0-9a-f]{40}$', auth_sha):
              print(f'Invalid authority_evidence_sha format: \"{auth_sha}\"', file=sys.stderr)
              sys.exit(1)

          if not re.match(r'^[A-Za-z0-9_\-\.\:\/]{1,128}$', auth_id):
              print(f'Invalid authority_id format: \"{auth_id}\"', file=sys.stderr)
              sys.exit(1)

          print('Authority input formats valid.')
          "

      - name: Checkout Executable AOS Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorized_execution_aos_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Executable AOS SHA Binding
        env:
          AUTHORIZED_EXECUTION_AOS_SHA: ${{ inputs.authorized_execution_aos_sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$AUTHORIZED_EXECUTION_AOS_SHA" ]; then
            echo "Executable AOS SHA mismatch failure!"
            exit 1
          fi

      - name: Checkout Authority Evidence Revision (Data Only)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authority_evidence_sha }}
          path: ${{ runner.temp }}/authority-evidence-checkout
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Authority Evidence Preflight
        env:
          AUTHORIZED_EXECUTION_AOS_SHA: ${{ inputs.authorized_execution_aos_sha }}
          AUTHORITY_EVIDENCE_SHA: ${{ inputs.authority_evidence_sha }}
          AUTHORITY_ID: ${{ inputs.authority_id }}
        run: |
          python -c "
          import os, sys
          from pathlib import Path
          from pilot_contracts.aos6_controlled_pilot_authority import verify_authority_preflight

          exec_sha = os.environ.get('AUTHORIZED_EXECUTION_AOS_SHA', '')
          auth_sha = os.environ.get('AUTHORITY_EVIDENCE_SHA', '')
          auth_id = os.environ.get('AUTHORITY_ID', '')
          exec_dir = Path.cwd()
          auth_dir = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'authority-evidence-checkout'

          ok, err = verify_authority_preflight(exec_sha, auth_sha, auth_id, exec_dir, auth_dir)
          if not ok:
              print(f'Authority evidence preflight failed: {err}', file=sys.stderr)
              sys.exit(1)
          print('Authority evidence preflight verified successfully.')
          "

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AOS Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest jsonschema

      - name: Execute Controlled Pilot Harness
        run: |
          python scripts/aos6_controlled_pilot_harness.py \
            pilot_contracts/aos6_controlled_pilot_request.json \
            ${{ runner.temp }}/aos6-controlled-pilot-report

      - name: Upload Controlled Pilot Evidence Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aos6-controlled-pilot-report
          path: ${{ runner.temp }}/aos6-controlled-pilot-report/
          retention-days: 90
