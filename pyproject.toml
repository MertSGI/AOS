[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aos"
version = "0.1.0"
description = "Agent Operating System deterministic controller, schema validation and orchestration utilities"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mert Ozcelikbas", email = "mert.ozcelikbass@gmail.com" }
]
dependencies = [
    "jsonschema[format-nongpl]>=4.20.0",
    "openai==3.3.1",
    "google-genai==2.19.0",
    "truststore==0.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
aos-validate = "aos.validate:main"
aos-run = "aos.autonomous_host:main"
aos-coordinator = "aos.local_host:main"
aos-panel = "aos.control_panel:main"
aos-runtime = "aos.runtime_server:main"
aos-runtime-supervisor = "aos.runtime_supervisor:main"
aosctl = "aos.runtime_cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aos*", "extensions"]

[tool.setuptools.package-data]
extensions = [
    "autonomy-fabric/*.py",
    "design-intelligence/*.py",
    "model-fabric/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live_read_only and not postgres_integration'"
markers = [
    "live_read_only: mark test as requiring live GitHub network access",
    "postgres_integration: mark test as requiring real PostgreSQL server connection"
]
